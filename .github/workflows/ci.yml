name: Build

on:
  push:
  pull_request:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        if: runner.os == 'Linux'
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - run: swift test
      - run: cargo build --release --locked --manifest-path Native/tokenizer/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path Scripts/install.ps1).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2.4-release
          swift-build: 6.2.4-RELEASE
      - run: swift test
      - run: cargo build --release --locked --manifest-path Native/tokenizer/Cargo.toml

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build --triple arm64-apple-ios16.0 -Xswiftc -sdk -Xswiftc "$(xcrun --sdk iphoneos --show-sdk-path)" -Xcc -isysroot -Xcc "$(xcrun --sdk iphoneos --show-sdk-path)" --product JuliaSwift
