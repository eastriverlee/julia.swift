name: Full model parity

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - run: cargo build --release --locked --manifest-path Native/tokenizer/Cargo.toml
      - run: python3 Scripts/run_parity.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2.4-release
          swift-build: 6.2.4-RELEASE
      - run: cargo build --release --locked --manifest-path Native/tokenizer/Cargo.toml
      - run: python Scripts/run_parity.py
